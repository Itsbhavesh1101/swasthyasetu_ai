name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 24.18.1
  PNPM_VERSION: 9.15.4
  PYTHON_VERSION: 3.12.13
  UV_VERSION: 0.12.20
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run backend quality gate
        run: python scripts/quality_gate.py backend

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Run frontend quality gate
        run: python scripts/quality_gate.py frontend

  persistence:
    name: Persistence integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: swasthyasetu
      POSTGRES_USER: swasthyasetu_dev
      POSTGRES_PASSWORD: ci-only-synthetic-password
      POSTGRES_PORT: "5432"
      BACKEND_PORT: "8000"
      SWASTHYASETU_DATABASE__ENABLED: "true"
      SWASTHYASETU_DATABASE__URL: postgresql+psycopg://swasthyasetu_dev:ci-only-synthetic-password@127.0.0.1:5432/swasthyasetu
      SWASTHYASETU_TEST_DATABASE_URL: postgresql+psycopg://swasthyasetu_dev:ci-only-synthetic-password@127.0.0.1:5432/swasthyasetu
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Start fresh PostgreSQL
        run: docker compose -f deployments/local/compose.yaml up -d postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose -f deployments/local/compose.yaml exec -T postgres \
              pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --dev

      - name: Verify migrations from clean database
        working-directory: backend
        shell: bash
        run: |
          test "$(uv run alembic -c alembic.ini heads | grep -c '(head)')" = "1"
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini current
          uv run alembic -c alembic.ini check
          uv run alembic -c alembic.ini downgrade p5b_0006
          test "$(docker compose -f ../deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('clinical_intakes','intake_answers','questionnaire_instances')")" = "0"
          test "$(docker compose -f ../deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('patients','patient_demographics','patient_identifiers','encounters','clinical_facts','clinical_fact_provenance','medications','allergies','observations')")" = "9"
          test "$(docker compose -f ../deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_constraint WHERE conname='fk_sessions_patient_id_patients'")" = "1"
          uv run alembic -c alembic.ini upgrade head
          uv run alembic -c alembic.ini check

      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: uv run pytest -m postgres

      - name: Inspect migration revision
        run: |
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc 'SELECT version_num FROM alembic_version')" = "p7a_0007"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='outbox_events'")" = "16"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='sessions'")" = "12"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='outbox_events' AND indexname IN ('ix_outbox_events_status_available_at','ix_outbox_events_event_type','ix_outbox_events_aggregate_id')")" = "3"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='sessions' AND indexname IN ('ix_sessions_status_expires_at','ix_sessions_patient_id','ix_sessions_actor_id')")" = "3"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='consent_records'")" = "15"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='consent_records' AND column_name='scope'")" = "jsonb"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('actors','actor_roles','sessions','outbox_events','consent_records','patients','patient_demographics','patient_identifiers','encounters','clinical_facts','clinical_fact_provenance','medications','allergies','observations','clinical_intakes','intake_answers','questionnaire_instances')")" = "17"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_constraint WHERE conname IN ('fk_actor_roles_actor_id_actors','fk_sessions_actor_id_actors','ck_actors_actor_type_supported','ck_actors_status_supported','ck_actor_roles_role_code_supported')")" = "5"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_constraint WHERE conname IN ('fk_consent_records_actor_id_actors','ck_consent_records_subject_type_supported','ck_consent_records_purpose_supported','ck_consent_records_status_supported','ck_consent_records_scope_json_array','ck_consent_records_expiry_after_grant')")" = "6"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='consent_records' AND indexname IN ('ix_consent_records_subject_type_subject_id_purpose_status','ix_consent_records_actor_id')")" = "2"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_constraint WHERE conname IN ('fk_sessions_patient_id_patients','ck_patients_status_supported','ck_patient_demographics_age_years_non_negative','ck_encounters_encounter_type_supported','ck_encounters_status_supported','ck_encounters_version_positive','ck_clinical_facts_fact_type_supported','ck_clinical_facts_verification_state_supported','ck_clinical_fact_provenance_source_type_supported','ck_clinical_fact_provenance_confidence_range','ck_observations_value_present')")" = "11"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('clinical_intakes','intake_answers','questionnaire_instances','documents','referrals','audit_events','safety_events','fhir_resources')")" = "3"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_constraint WHERE conname IN ('uq_clinical_intakes_encounter_id','fk_clinical_intakes_encounter_id_encounters','ck_clinical_intakes_status_supported','ck_clinical_intakes_version_positive','ck_clinical_intakes_completed_at_lifecycle','ck_clinical_intakes_chief_complaint_json_object','ck_clinical_intakes_hpi_json_object','ck_clinical_intakes_history_sections_json_object','ck_clinical_intakes_missing_information_json_array','ck_clinical_intakes_contradictions_json_array','fk_intake_answers_intake_id_clinical_intakes','ck_intake_answers_source_type_supported','ck_intake_answers_answer_json_object','fk_questionnaire_instances_encounter_id_encounters','ck_questionnaire_instances_status_supported','ck_questionnaire_instances_responses_json_object','ck_questionnaire_instances_completed_at_lifecycle')")" = "17"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc \
            "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('ix_intake_answers_intake_id_question_id','ix_questionnaire_instances_encounter_questionnaire')")" = "2"

      - name: Clean up PostgreSQL and volume
        if: always()
        run: docker compose -f deployments/local/compose.yaml down -v --remove-orphans

  docker-postgres:
    name: Docker and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: swasthyasetu
      POSTGRES_USER: swasthyasetu_dev
      POSTGRES_PASSWORD: ci-only-synthetic-password
      POSTGRES_PORT: "5432"
      BACKEND_PORT: "8000"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose -f deployments/local/compose.yaml config

      - name: Start PostgreSQL
        run: docker compose -f deployments/local/compose.yaml up -d postgres

      - name: Verify PostgreSQL health and query
        shell: bash
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' swasthyasetu-local-postgres-1)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          test "$status" = "healthy"
          docker compose -f deployments/local/compose.yaml ps
          docker compose -f deployments/local/compose.yaml exec -T postgres \
            pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          test "$(docker compose -f deployments/local/compose.yaml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc 'SELECT 1')" = "1"

      - name: Build backend image
        run: docker compose -f deployments/local/compose.yaml build backend

      - name: Run explicit container migration
        run: docker compose -f deployments/local/compose.yaml run --rm backend alembic -c /app/alembic.ini upgrade head

      - name: Start backend
        run: docker compose -f deployments/local/compose.yaml up -d backend

      - name: Verify backend image and health
        shell: bash
        run: |
          test "$(docker image inspect swasthyasetu/backend:p3-a-local --format '{{.Config.User}}')" = "10001:10001"
          docker image inspect swasthyasetu/backend:p3-a-local --format '{{json .Config.ExposedPorts}}' | grep -q '8000/tcp'
          docker compose -f deployments/local/compose.yaml run --rm backend python -c \
            "import alembic, psycopg, sqlalchemy; print(alembic.__version__, psycopg.__version__, sqlalchemy.__version__)"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live > /tmp/live.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/live.json
          curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"database":"ok"' /tmp/ready.json

      - name: Clean up containers and volume
        if: always()
        run: docker compose -f deployments/local/compose.yaml down -v --remove-orphans

  playwright:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_DB: swasthyasetu
      POSTGRES_USER: swasthyasetu_dev
      POSTGRES_PASSWORD: ci-only-synthetic-password
      POSTGRES_PORT: "5432"
      BACKEND_PORT: "8000"
      SWASTHYASETU_DATABASE__ENABLED: "true"
      SWASTHYASETU_DATABASE__URL: postgresql+psycopg://swasthyasetu_dev:ci-only-synthetic-password@127.0.0.1:5432/swasthyasetu
      SWASTHYASETU_BACKEND_URL: http://127.0.0.1:8000
      SWASTHYASETU_FEATURES__ENABLED: '["engineering_clinical_intake"]'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start PostgreSQL
        run: docker compose -f deployments/local/compose.yaml up -d postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..30}; do
            if docker compose -f deployments/local/compose.yaml exec -T postgres \
              pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --dev

      - name: Migrate database
        working-directory: backend
        run: uv run alembic -c alembic.ini upgrade head

      - name: Start backend and wait for readiness
        shell: bash
        run: |
          cd backend
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-playwright.log 2>&1 &
          cd ..
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /tmp/ready.json; then
              grep -q '"database":"ok"' /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          cat backend-playwright.log
          exit 1

      - name: Run browser journeys
        run: pnpm e2e:test

      - name: Clean up PostgreSQL and volume
        if: always()
        run: docker compose -f deployments/local/compose.yaml down -v --remove-orphans

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan repository dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build backend image for scanning
        run: docker build --file infra/docker/backend.Dockerfile --tag swasthyasetu/backend:p3-a-ci .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: swasthyasetu/backend:p3-a-ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
